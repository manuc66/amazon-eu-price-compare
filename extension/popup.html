<!doctype html>
<html>
  <meta charset="UTF-8">
  <head>
    <title>Amazon EU Price Compare</title>
    <style>
      body {
        font-family: "Segoe UI", "Lucida Grande", Tahoma, sans-serif;
        font-size: 100%;
        /* a fixed width keeps the panel from resizing while prices arrive */
        width: 380px;
        min-height: 200px;
        margin: 0;
        padding: 4px 6px;
        box-sizing: border-box;
      }
      .progress {
        height: 3px;
        margin-bottom: 4px;
        background-color: #eee;
        overflow: hidden;
      }
      .progress-bar {
        width: 40%;
        height: 100%;
        background-color: #2196F3;
        animation: slide 1.1s infinite ease-in-out;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to   { transform: translateX(250%); }
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 190px;
        color: #666;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin-bottom: 10px;
        border: 3px solid #eee;
        border-top-color: #2196F3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {text-decoration: none; }
      td {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }
      td.amazon {
        text-align: center;
        width: 100px;
      }
      td.country {
        text-align: center;
        width: 50px;
      }
      td.price {
        text-align: left;
      }
      td.country a.history {
        margin-left: 3px;
        font-size: 12px;
      }
      td.country a.history + a.history {
        margin-left: 2px;
        font-weight: bold;
        font-size: 10px;
        color: #666;
      }
      tr:first-child {
        font-weight: bold;
        color: red;
      }
      p {
        white-space: nowrap;
      }
      .optionslink {
        cursor: pointer;
        display: flex;
        justify-content: flex-end;
        text-decoration: underline;
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
