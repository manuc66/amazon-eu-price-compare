<!doctype html>
<html>
  <meta charset="UTF-8">
  <head>
    <title>Amazon EU Price Compare</title>
    <style>
      body {
        font-family: "Segoe UI", "Lucida Grande", Tahoma, sans-serif;
        font-size: 100%;
        /* a fixed width keeps the panel from resizing while prices arrive */
        width: 380px;
        min-height: 200px;
        margin: 0;
        padding: 4px 6px;
        box-sizing: border-box;
      }
      .progress {
        height: 3px;
        margin-bottom: 4px;
        background-color: #eee;
        overflow: hidden;
      }
      .progress-bar {
        width: 40%;
        height: 100%;
        background-color: #2196F3;
        animation: slide 1.1s infinite ease-in-out;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to   { transform: translateX(250%); }
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 190px;
        color: #666;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin-bottom: 10px;
        border: 3px solid #eee;
        border-top-color: #2196F3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {text-decoration: none; }
      table.pricelist {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        white-space: nowrap;
        padding: 2px 4px;
        vertical-align: middle;
      }
      td.amazon {
        text-align: left;
        color: #888;
        font-size: 90%;
      }
      td.country {
        text-align: left;
        white-space: nowrap;
      }
      td.price {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td.rank {
        text-align: right;
        color: #666;
      }
      /* price history links live in their own column, on the right, so the rows
         that have none do not leave a gap in the middle of the table.
         width:1% keeps the column at its content size, and nothing may clip it:
         overflow:hidden on a td shrinks it to nothing when the table is squeezed */
      td.history {
        width: 1%;
        text-align: right;
        white-space: nowrap;
      }
      td.history a {
        margin-left: 4px;
        font-size: 12px;
        vertical-align: middle;
      }
      td.history a.keepa {
        font-weight: bold;
        color: #444;
      }
      tr:first-child {
        font-weight: bold;
        color: red;
      }
      p {
        white-space: nowrap;
      }
      .toolbar {
        display: flex;
        justify-content: flex-end;
        padding-top: 2px;
      }
      button.refresh {
        background: none;
        border: 0;
        padding: 0 2px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        color: #bbb;
      }
      button.refresh:hover {
        color: #666;
      }
      .optionslink {
        cursor: pointer;
        display: flex;
        justify-content: flex-end;
        text-decoration: underline;
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
